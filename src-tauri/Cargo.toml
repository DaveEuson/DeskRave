[package]
name = "app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# local radio proxy: fetch a stream (ureq/rustls) and re-serve it same-origin with
# open CORS (tiny_http) so the visualizer's AnalyserNode can read it
tiny_http = "0.12"
ureq = "2"
urlencoding = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
