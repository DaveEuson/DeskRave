<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Desk Rave</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d946ef" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Press Start 2P is bundled locally (src/fonts, via @font-face in styles.css) — no CDN -->

  </head>
  <body>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="crt"></div>
      <div id="drop"><span>drop audio to add it to your library<br /><small>mp3 · wav · aiff · flac · m4a · ogg</small></span></div>
      <button id="qrBtn" title="phone remote">📱</button>
      <div id="deskClock" hidden><span class="dc-time">—</span><span class="dc-date"></span></div>
      <div id="breakSign" hidden></div>
      <div id="deskTimer"></div>
      <div id="venueNav">
        <button id="venuePrev" title="previous venue">◀</button>
        <button id="venueName" title="all venues">—</button>
        <button id="venueNext" title="next venue">▶</button>
      </div>
      <div id="venueBoard" hidden>
        <div class="vb-scrim"></div>
        <div class="vb-panel">
          <div class="vb-head"><span>Pick a venue</span><button class="vb-close" title="close">✕</button></div>
          <div class="vb-grid"></div>
        </div>
      </div>
      <div id="camPreview" hidden>
        <video id="camVideo" autoplay muted playsinline></video>
        <img id="camSnap" alt="" hidden />
        <canvas id="camBoxes" width="160" height="120"></canvas>
        <div id="camStatus">camera</div>
        <button id="camHide" title="hide preview">×</button>
      </div>
      <div id="toasts"></div>
      <div id="cops"><div class="cops-label">🚓 BUSTED!</div></div>
      <div id="breakFlash"><div class="break-label">🌿 BREAK TIME</div></div>
    </div>
    <div id="volFader" title="volume">
      <div class="vf-track"><div class="vf-fill"></div></div>
      <div class="vf-knob"></div>
      <div class="vf-ico">🔊</div>
    </div>
    <div id="buffs"></div>
    <div id="fanFeed"></div>
    <div id="nowPlaying" hidden><span class="np-title">—</span><span class="np-sub"></span></div>
    <div id="qrOverlay" hidden>
      <div class="qr-scrim"></div>
      <div class="qr-panel">
        <div class="qr-head"><span>📱 Phone remote</span><button class="qr-close" title="close">✕</button></div>
        <img class="qr-img" alt="QR code for the phone remote" />
        <div class="qr-url">—</div>
        <small>Scan to control this kiosk — same Wi-Fi</small>
      </div>
    </div>
    <div id="discover" hidden>
      <div class="dv-scrim"></div>
      <div class="dv-panel">
        <div class="dv-head"><span>🎵 Get more music</span><button class="dv-close" title="close">✕</button></div>
        <div class="dv-body"></div>
      </div>
    </div>
    <div id="library" hidden>
      <div class="lb-scrim"></div>
      <div class="lb-panel">
        <div class="lb-head"><span class="lb-title">🎵 Library</span><span class="lb-count"></span><input class="lb-search" placeholder="filter by title or artist…" /><button class="lb-close" title="close">✕</button></div>
        <div class="lb-radio"></div>
        <div class="lb-filters"></div>
        <div class="lb-grid"></div>
      </div>
    </div>
    <div id="controls"></div>
    <input id="file" type="file" accept="audio/*,.mp3,.wav,.aiff,.aif,.flac,.m4a,.ogg" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
