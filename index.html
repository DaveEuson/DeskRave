<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pixel DJ</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d946ef" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="crt"></div>
      <div id="drop"><span>drop audio to add it to your library<br /><small>mp3 · wav · aiff · flac · m4a · ogg</small></span></div>
      <div id="deskTimer"></div>
      <div id="toasts"></div>
    </div>
    <div id="controls"></div>
    <input id="file" type="file" accept="audio/*,.mp3,.wav,.aiff,.aif,.flac,.m4a,.ogg" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
