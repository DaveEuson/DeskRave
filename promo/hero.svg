<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Press Start 2P', ui-monospace, 'Courier New', monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160c2b"/>
      <stop offset="1" stop-color="#0b0714"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#d24fe0"/>
      <stop offset="1" stop-color="#e64fd6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#e64fd6"/>
      <stop offset="1" stop-color="#ffd86a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d24fe0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d24fe0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="360" fill="url(#sky)"/>
  <ellipse cx="600" cy="150" rx="470" ry="150" fill="url(#glow)"/>
  <!-- scanlines -->
  <g fill="#7c3aed" opacity="0.05">
    <rect y="0" width="1200" height="360" opacity="0"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1" opacity="0.06">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="30" x2="1200" y2="30"/>
  </g>

  <!-- string lights -->
  <path d="M0 34 Q150 66 300 40 T600 40 T900 40 T1200 34" fill="none" stroke="#3a2c58" stroke-width="2"/>
  <g filter="url(#soft)">
    <circle cx="90" cy="52" r="6" fill="#d24fe0"/><circle cx="230" cy="47" r="6" fill="#ffd86a"/>
    <circle cx="370" cy="52" r="6" fill="#7c3aed"/><circle cx="510" cy="47" r="6" fill="#ff9e5e"/>
    <circle cx="690" cy="47" r="6" fill="#d946ef"/><circle cx="830" cy="52" r="6" fill="#ffd86a"/>
    <circle cx="970" cy="47" r="6" fill="#7c3aed"/><circle cx="1110" cy="52" r="6" fill="#d24fe0"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-weight="bold">
    <text x="600" y="176" font-size="86" letter-spacing="6" fill="#d24fe0" opacity="0.9" filter="url(#blur)">DESK RAVE</text>
    <text x="600" y="176" font-size="86" letter-spacing="6" fill="url(#neon)">DESK RAVE</text>
    <text x="600" y="220" font-size="17" letter-spacing="2" fill="#cdbffb">a tiny 16-bit club for your desk</text>
    <text x="600" y="246" font-size="12" letter-spacing="1" fill="#8a7fae">it dances to your music — and keeps your focus honest</text>
  </g>

  <!-- EQ wall -->
  <g transform="translate(300,318)">
    <g filter="url(#soft)" opacity="0.8">
      <rect x="0"   y="-34" width="16" height="34" fill="url(#bar)"/><rect x="24"  y="-58" width="16" height="58" fill="url(#bar)"/>
      <rect x="48"  y="-26" width="16" height="26" fill="url(#bar)"/><rect x="72"  y="-70" width="16" height="70" fill="url(#bar)"/>
      <rect x="96"  y="-44" width="16" height="44" fill="url(#bar)"/><rect x="120" y="-62" width="16" height="62" fill="url(#bar)"/>
      <rect x="144" y="-30" width="16" height="30" fill="url(#bar)"/><rect x="168" y="-52" width="16" height="52" fill="url(#bar)"/>
      <rect x="192" y="-40" width="16" height="40" fill="url(#bar)"/><rect x="216" y="-66" width="16" height="66" fill="url(#bar)"/>
      <rect x="240" y="-48" width="16" height="48" fill="url(#bar)"/><rect x="264" y="-56" width="16" height="56" fill="url(#bar)"/>
      <rect x="288" y="-28" width="16" height="28" fill="url(#bar)"/><rect x="312" y="-64" width="16" height="64" fill="url(#bar)"/>
      <rect x="336" y="-38" width="16" height="38" fill="url(#bar)"/><rect x="360" y="-54" width="16" height="54" fill="url(#bar)"/>
      <rect x="384" y="-32" width="16" height="32" fill="url(#bar)"/><rect x="408" y="-60" width="16" height="60" fill="url(#bar)"/>
      <rect x="432" y="-42" width="16" height="42" fill="url(#bar)"/><rect x="456" y="-50" width="16" height="50" fill="url(#bar)"/>
      <rect x="480" y="-36" width="16" height="36" fill="url(#bar)"/><rect x="504" y="-68" width="16" height="68" fill="url(#bar)"/>
      <rect x="528" y="-44" width="16" height="44" fill="url(#bar)"/><rect x="552" y="-58" width="16" height="58" fill="url(#bar)"/>
      <rect x="576" y="-30" width="16" height="30" fill="url(#bar)"/>
    </g>
  </g>

  <!-- pixel crowd -->
  <g fill="#1b1233">
    <g id="c"><rect x="0" y="336" width="18" height="24"/><rect x="4" y="326" width="10" height="12"/></g>
  </g>
  <g fill="#241640">
    <rect x="0"   y="340" width="20" height="20"/><rect x="30"  y="334" width="22" height="26"/><rect x="66"  y="342" width="18" height="18"/>
    <rect x="98"  y="332" width="22" height="28"/><rect x="134" y="340" width="20" height="20"/><rect x="168" y="336" width="20" height="24"/>
    <rect x="1030" y="338" width="20" height="22"/><rect x="1062" y="332" width="22" height="28"/><rect x="1098" y="342" width="18" height="18"/>
    <rect x="1128" y="336" width="22" height="24"/><rect x="1162" y="340" width="20" height="20"/>
  </g>
</svg>
